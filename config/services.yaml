services:
  _defaults:
    autoconfigure: true
    autowire: false

  FriendsOfContao\AssociateGroups\AssociateGroups:
    arguments:
      - '@database_connection'

  FriendsOfContao\AssociateGroups\Controller\SyncGroupsController:
    public: true
    arguments:
      - '@FriendsOfContao\AssociateGroups\AssociateGroups'
      - '@router'
      - '@security.helper'
      - '@translator'
      - '@contao.framework'

  FriendsOfContao\AssociateGroups\EventListener\BackendStyleListener:
    arguments:
      - '@contao.framework'
      - '@contao.routing.scope_matcher'

  FriendsOfContao\AssociateGroups\EventListener\Dca\DeleteGroupListener:
    arguments:
      - '@FriendsOfContao\AssociateGroups\AssociateGroups'

  FriendsOfContao\AssociateGroups\EventListener\Dca\DeleteGroupsListener:
    arguments:
      - '@FriendsOfContao\AssociateGroups\AssociateGroups'

  FriendsOfContao\AssociateGroups\EventListener\Dca\SyncOperationListener:
    arguments:
      - '@router'
      - '@FriendsOfContao\AssociateGroups\AssociateGroups'

  FriendsOfContao\AssociateGroups\EventListener\Dca\UpdateGroupsListener:
    arguments:
      - '@FriendsOfContao\AssociateGroups\AssociateGroups'

  FriendsOfContao\AssociateGroups\EventListener\Hook\CreateNewUserListener:
    arguments:
      - '@FriendsOfContao\AssociateGroups\AssociateGroups'

  FriendsOfContao\AssociateGroups\Migration\SyncGroupsMigration:
    arguments:
      - '@FriendsOfContao\AssociateGroups\AssociateGroups'
      - '@database_connection'
